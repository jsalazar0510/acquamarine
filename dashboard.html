<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>acquamarina · panel</title>
<style>
  :root{ --crema:#F6F0E4; --arena:#EDE2CF; --tierra:#7A6A55; --camel:#B08968; --blanco:#FFFDF8; --suave:#9C8B74; --verde:#5FA97B; --rojo:#A05B4C; }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--crema); color:var(--tierra); font-family:'Avenir Next','Segoe UI',system-ui,sans-serif;}
  .wrap{max-width:1000px; margin:0 auto; padding:20px 16px 60px;}
  .serif{font-family:Georgia,serif;}
  h1{font-family:Georgia,serif; font-weight:400; font-size:26px; letter-spacing:2px; text-transform:lowercase; margin:0 0 4px;}
  .sub{font-size:12px; color:var(--suave); letter-spacing:1px; text-transform:uppercase; margin-bottom:18px;}
  .tabs{display:flex; gap:6px; overflow-x:auto; margin-bottom:18px; border-bottom:1px solid var(--arena); padding-bottom:2px;}
  .tab{padding:9px 16px; border-radius:10px 10px 0 0; font-size:14px; cursor:pointer; background:none; border:none; color:var(--suave); white-space:nowrap; font-family:inherit;}
  .tab.on{background:var(--blanco); color:var(--tierra); font-weight:600; border:1px solid var(--arena); border-bottom:1px solid var(--blanco); margin-bottom:-1px;}
  .card{background:var(--blanco); border:1px solid var(--arena); border-radius:14px; padding:16px; margin-bottom:16px;}
  .kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-bottom:16px;}
  .kpi{background:var(--blanco); border:1px solid var(--arena); border-radius:12px; padding:12px; text-align:center;}
  .kpi b{font-size:20px; display:block;}
  .kpi span{font-size:10px; letter-spacing:1px; text-transform:uppercase; color:var(--suave);}
  .row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px;}
  .chip{padding:6px 14px; border-radius:999px; font-size:13px; cursor:pointer; border:1px solid var(--arena); background:var(--blanco); color:var(--tierra); font-family:inherit;}
  .chip.on{background:var(--camel); border-color:var(--camel); color:#fff;}
  label{font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--suave); display:block; margin:10px 0 4px;}
  input, select{width:100%; padding:9px 10px; border-radius:8px; border:1px solid var(--arena); background:var(--blanco); color:var(--tierra); font-size:14px; font-family:inherit;}
  .form-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px;}
  .btn{border:1px solid var(--arena); background:var(--blanco); color:var(--tierra); border-radius:999px; padding:10px 18px; font-size:14px; cursor:pointer; font-family:inherit;}
  .btn.main{background:var(--camel); border-color:var(--camel); color:#fff;}
  .btn.wa{background:var(--verde); border-color:var(--verde); color:#fff;}
  .btn.small{padding:5px 12px; font-size:12px;}
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{text-align:left; font-size:10px; letter-spacing:1px; text-transform:uppercase; color:var(--suave); padding:6px 8px; border-bottom:1px solid var(--arena);}
  td{padding:7px 8px; border-bottom:1px solid var(--arena);}
  tr.vendido{opacity:.5;}
  .tag{font-size:10px; padding:2px 8px; border-radius:999px; background:var(--arena);}
  .tag.debe{background:#F3D9C5; color:var(--rojo);}
  .tag.pagado{background:#D8ECD9; color:#3E7A4C;}
  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--tierra); color:#fff; padding:10px 18px; border-radius:999px; font-size:13px; z-index:60; max-width:90vw; text-align:center;}
  .empty{text-align:center; color:var(--suave); padding:30px; font-size:13px;}
  .linkbox{background:var(--arena); border-radius:10px; padding:12px; font-size:13px; word-break:break-all; margin-bottom:12px;}
  .subtabs{display:flex; gap:8px; margin-bottom:14px;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ═══════════════════════════════════════════════════════════════
   CONFIGURACIÓN
   ═══════════════════════════════════════════════════════════════ */
const SCRIPT_URL  = "https://script.google.com/macros/s/AKfycbxyq5bkVKNjN3CRAnq7f6sh2d7PH222_BYbFrHfPQgdTYPiI6dbvoqURrvH9a24mppR/exec";
const CATALOGO_URL = "https://jsalazar0510.github.io/acquamarine/";
const WHATSAPP_ANTONIA = "573001234567"; // ⚠️ cámbielo por el WhatsApp real de Antonia
/* ═══════════════════════════════════════════════════════════════ */

const GROUP_LABEL = { clips:"hair clips", tanks:"tank tops" };
const state = { tab:"resumen", inventario:[], facturas:[], invFiltro:"todo", loading:true };

const fmtCOP = n => new Intl.NumberFormat("es-CO",{style:"currency",currency:"COP",maximumFractionDigits:0}).format(n||0);
const esc = s => String(s??"").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const grupoDe = code => Number(code) >= 2000 ? "tanks" : "clips";

let toastTimer;
function toast(msg){
  document.querySelectorAll(".toast").forEach(e=>e.remove());
  const t=document.createElement("div"); t.className="toast"; t.textContent=msg;
  document.body.appendChild(t);
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.remove(),2600);
}

async function copyText(text){
  try{ await navigator.clipboard.writeText(text); return true; }
  catch{ try{ const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); return true; }catch{ return false; } }
}

async function llamar(accion, datos){
  const res = await fetch(SCRIPT_URL, {
    method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
    body: JSON.stringify({ accion, ...datos }),
  });
  const json = await res.json();
  if(!json.ok) throw new Error(json.error || "fallo");
  return json;
}

function resizeImage(file, maxSide=1080, quality=0.85){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxSide/Math.max(img.width,img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width*scale); c.height = Math.round(img.height*scale);
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        resolve(c.toDataURL("image/jpeg", quality).split(",")[1]);
      };
      img.onerror = reject; img.src = e.target.result;
    };
    reader.onerror = reject; reader.readAsDataURL(file);
  });
}

async function subirFoto(code, file){
  const base64 = await resizeImage(file);
  await llamar("foto", { code, filename: code+"-"+Date.now()+".jpg", mimeType:"image/jpeg", data: base64 });
}

async function cargarTodo(){
  state.loading = true; render();
  try{
    const [rInv, rFact] = await Promise.all([
      fetch(SCRIPT_URL+"?tipo=inventario&t="+Date.now()).then(r=>r.json()),
      fetch(SCRIPT_URL+"?tipo=facturas&t="+Date.now()).then(r=>r.json()),
    ]);
    if(rInv.ok) state.inventario = rInv.productos;
    if(rFact.ok) state.facturas = rFact.facturas.sort((a,b)=> b.id - a.id);
  }catch(err){ toast("No se pudo cargar del servidor — revisa la conexión"); }
  state.loading = false; render();
}

/* ═══════════════════════ RENDER ═══════════════════════ */
function render(){
  const app = document.getElementById("app");
  app.innerHTML = `
    <h1>acquamarina</h1>
    <div class="sub">panel de gestión</div>
    <div class="tabs">
      ${tabBtn("resumen","📊 resumen ejecutivo")}
      ${tabBtn("facturacion","🧾 facturación")}
      ${tabBtn("inventario","📦 inventario")}
      ${tabBtn("cxc","💰 cuentas x cobrar")}
      ${tabBtn("ventas","📈 ventas")}
      ${tabBtn("catalogo","🐚 catálogo")}
    </div>
    <div id="contenido"></div>
  `;
  const c = document.getElementById("contenido");
  if(state.loading){ c.innerHTML = `<div class="empty">cargando datos…</div>`; return; }
  if(state.tab==="resumen") c.innerHTML = viewResumen();
  if(state.tab==="facturacion") c.innerHTML = viewFacturacion();
  if(state.tab==="inventario") c.innerHTML = viewInventario();
  if(state.tab==="cxc") c.innerHTML = viewCxC();
  if(state.tab==="ventas") c.innerHTML = viewVentas();
  if(state.tab==="catalogo") c.innerHTML = viewCatalogo();
  wireEvents();
}
function tabBtn(id,label){ return `<button class="tab ${state.tab===id?"on":""}" data-tab="${id}">${label}</button>`; }

/* ── Resumen ejecutivo ── */
function viewResumen(){
  const disponibles = state.inventario.filter(p=>!p.vendido);
  const valorInventario = disponibles.reduce((s,p)=>s+p.cant*p.valorVenta,0);
  const inversionInventario = disponibles.reduce((s,p)=>s+p.cant*p.valorCompra,0);
  const gananciaPotencial = valorInventario - inversionInventario;
  const unidadesDisponibles = disponibles.reduce((s,p)=>s+p.cant,0);
  const productosAgotados = state.inventario.filter(p=>p.vendido).length;

  const totalVendido = state.facturas.reduce((s,f)=>s+f.valor,0);
  const cxc = state.facturas.filter(f=>String(f.forma||"").toLowerCase().includes("debe"));
  const totalCxC = cxc.reduce((s,f)=>s+f.valor,0);

  // top 5 productos más vendidos (por número de veces facturados)
  const conteo = {};
  state.facturas.forEach(f=>{
    const key = f.codigo+"·"+f.producto;
    conteo[key] = (conteo[key]||0)+1;
  });
  const top5 = Object.entries(conteo).sort((a,b)=>b[1]-a[1]).slice(0,5);

  const ultimas = state.facturas.slice(0,5);

  return `
    <div class="card">
      <div class="serif" style="font-size:16px; margin-bottom:10px;">el negocio hoy</div>
      <div class="kpis">
        <div class="kpi"><b class="serif">${fmtCOP(totalVendido)}</b><span>facturado total</span></div>
        <div class="kpi"><b>${state.facturas.length}</b><span>ventas realizadas</span></div>
        <div class="kpi"><b class="serif">${fmtCOP(totalCxC)}</b><span>por cobrar</span></div>
        <div class="kpi"><b>${productosAgotados}</b><span>productos agotados</span></div>
      </div>
    </div>
    <div class="card">
      <div class="serif" style="font-size:16px; margin-bottom:10px;">inventario disponible</div>
      <div class="kpis">
        <div class="kpi"><b>${unidadesDisponibles}</b><span>unidades disponibles</span></div>
        <div class="kpi"><b class="serif">${fmtCOP(valorInventario)}</b><span>valor a precio venta</span></div>
        <div class="kpi"><b class="serif">${fmtCOP(inversionInventario)}</b><span>inversión (costo)</span></div>
        <div class="kpi"><b class="serif">${fmtCOP(gananciaPotencial)}</b><span>ganancia potencial</span></div>
      </div>
    </div>
    <div class="card">
      <div class="serif" style="font-size:16px; margin-bottom:10px;">productos más vendidos</div>
      ${top5.length ? `<table><thead><tr><th>producto</th><th>veces vendido</th></tr></thead><tbody>
        ${top5.map(([k,n])=>`<tr><td>${esc(k.split("·")[1])} (ref. ${esc(k.split("·")[0])})</td><td>${n}</td></tr>`).join("")}
      </tbody></table>` : `<div class="empty">aún no hay ventas para mostrar un ranking</div>`}
    </div>
    <div class="card">
      <div class="serif" style="font-size:16px; margin-bottom:10px;">últimas ventas</div>
      ${ultimas.length ? `<table><thead><tr><th>fecha</th><th>comprador</th><th>producto</th><th>valor</th><th>pago</th></tr></thead><tbody>
        ${ultimas.map(f=>`<tr><td>${esc(f.fecha)}</td><td>${esc(f.comprador)}</td><td>${esc(f.producto)}</td><td>${fmtCOP(f.valor)}</td><td>${pagoTag(f.forma)}</td></tr>`).join("")}
      </tbody></table>` : `<div class="empty">aún no hay ventas registradas</div>`}
    </div>`;
}

/* ── Facturación ── */
function viewFacturacion(){
  const disponibles = state.inventario.filter(p=>p.cant>0);
  return `
    <div class="card">
      <div class="serif" style="font-size:16px; margin-bottom:10px;">registrar venta</div>
      <div class="form-row">
        <div><label>producto</label>
          <select id="f-codigo">
            <option value="">Escoja un producto…</option>
            ${disponibles.map(p=>`<option value="${p.code}" data-precio="${p.valorVenta}">${p.code} · ${esc(p.name)} (${p.cant} disp.)</option>`).join("")}
          </select>
        </div>
        <div><label>comprador</label><input type="text" id="f-comprador" placeholder="nombre de quien compra"></div>
        <div><label>valor</label><input type="number" id="f-valor" placeholder="se llena solo, editable"></div>
        <div><label>forma de pago</label>
          <select id="f-forma">
            <option>Efectivo</option><option>Transferencia</option><option>Debe aún</option>
          </select>
        </div>
      </div>
      <div style="margin-top:12px;"><button class="btn main" id="btn-registrar">registrar venta</button></div>
    </div>
    <div class="card">
      <div class="serif" style="font-size:16px; margin-bottom:10px;">ventas registradas (${state.facturas.length})</div>
      ${state.facturas.length ? `<table><thead><tr><th>fecha</th><th>comprador</th><th>ref</th><th>producto</th><th>valor</th><th>pago</th></tr></thead><tbody>
        ${state.facturas.map(f=>`<tr>
          <td>${esc(f.fecha)}</td><td>${esc(f.comprador)}</td><td>${esc(f.codigo)}</td><td>${esc(f.producto)}</td>
          <td>${fmtCOP(f.valor)}</td><td>${pagoTag(f.forma)}</td>
        </tr>`).join("")}
      </tbody></table>` : `<div class="empty">aún no hay ventas registradas</div>`}
    </div>`;
}
function pagoTag(forma){
  const f=String(forma||"").toLowerCase();
  if(f.includes("debe")) return `<span class="tag debe">debe aún</span>`;
  return `<span class="tag pagado">${esc(forma)}</span>`;
}

/* ── Inventario ── */
function viewInventario(){
  let lista = state.inventario;
  if(state.invFiltro==="vendidos") lista = lista.filter(p=>p.vendido);
  if(state.invFiltro==="disponibles") lista = lista.filter(p=>!p.vendido);
  return `
    <div class="row">
      <button class="chip ${state.invFiltro==="todo"?"on":""}" data-filtro="todo">todo (${state.inventario.length})</button>
      <button class="chip ${state.invFiltro==="vendidos"?"on":""}" data-filtro="vendidos">vendidos (${state.inventario.filter(p=>p.vendido).length})</button>
      <button class="chip ${state.invFiltro==="disponibles"?"on":""}" data-filtro="disponibles">en inventario (${state.inventario.filter(p=>!p.vendido).length})</button>
      <button class="chip" id="btn-refrescar-inv">🔄 actualizar</button>
    </div>
    <div class="card">
      <div class="serif" style="font-size:16px; margin-bottom:10px;">agregar producto nuevo</div>
      <div class="form-row">
        <div><label>código</label><input type="text" id="p-codigo" placeholder="ej: 1019"></div>
        <div><label>producto</label><input type="text" id="p-nombre" placeholder="nombre"></div>
        <div><label>tipo</label><select id="p-tipo"><option>Pinza</option><option>TOP</option></select></div>
        <div><label>cantidad</label><input type="number" id="p-cant" value="1"></div>
        <div><label>valor compra</label><input type="number" id="p-compra"></div>
        <div><label>valor venta</label><input type="number" id="p-venta"></div>
        <div><label>código proveedor</label><input type="text" id="p-proveedor"></div>
      </div>
      <div style="margin-top:12px;"><button class="btn main" id="btn-agregar-prod">agregar al inventario</button></div>
    </div>
    <div class="card">
      <input type="file" id="input-foto" accept="image/*" multiple style="display:none">
      <table><thead><tr><th>código</th><th>producto</th><th>tipo</th><th>cant.</th><th>compra</th><th>venta</th><th>proveedor</th><th></th></tr></thead><tbody>
        ${lista.length ? lista.map(p=>`<tr class="${p.vendido?"vendido":""}">
          <td>${p.code}</td><td>${esc(p.name)}</td><td>${esc(p.tipo)}</td><td>${p.cant}</td>
          <td>${fmtCOP(p.valorCompra)}</td><td>${fmtCOP(p.valorVenta)}</td><td>${esc(p.codigoProveedor)}</td>
          <td style="white-space:nowrap;">
            <button class="btn small" data-editar="${p.code}">editar</button>
            <button class="btn small" data-foto="${p.code}">📷 foto</button>
          </td>
        </tr>`).join("") : `<tr><td colspan="8" class="empty">nada por aquí</td></tr>`}
      </tbody></table>
    </div>`;
}

/* ── Cuentas por cobrar ── */
function viewCxC(){
  const pendientes = state.facturas.filter(f=>String(f.forma||"").toLowerCase().includes("debe"));
  const total = pendientes.reduce((s,f)=>s+f.valor,0);
  return `
    <div class="kpis">
      <div class="kpi"><b>${pendientes.length}</b><span>cuentas pendientes</span></div>
      <div class="kpi"><b class="serif">${fmtCOP(total)}</b><span>total por cobrar</span></div>
    </div>
    <div class="card">
      ${pendientes.length ? `<table><thead><tr><th>fecha</th><th>comprador</th><th>producto</th><th>valor</th><th></th></tr></thead><tbody>
        ${pendientes.map(f=>`<tr>
          <td>${esc(f.fecha)}</td><td>${esc(f.comprador)}</td><td>${esc(f.producto)}</td><td>${fmtCOP(f.valor)}</td>
          <td><button class="btn small" data-cobrar="${f.id}">marcar cobrado</button></td>
        </tr>`).join("")}
      </tbody></table>` : `<div class="empty">no hay cuentas pendientes 🎉</div>`}
    </div>`;
}

/* ── Ventas ── */
function viewVentas(){
  const total = state.facturas.reduce((s,f)=>s+f.valor,0);
  const porDia = {};
  state.facturas.forEach(f=>{ porDia[f.fecha]=(porDia[f.fecha]||0)+f.valor; });
  const dias = Object.keys(porDia).sort().reverse();

  const porSeg = { clips:{n:0,total:0}, tanks:{n:0,total:0} };
  state.facturas.forEach(f=>{ const g=grupoDe(f.codigo); porSeg[g].n++; porSeg[g].total+=f.valor; });

  return `
    <div class="kpis">
      <div class="kpi"><b>${state.facturas.length}</b><span>ventas totales</span></div>
      <div class="kpi"><b class="serif">${fmtCOP(total)}</b><span>facturado total</span></div>
      <div class="kpi"><b class="serif">${fmtCOP(state.facturas.length?total/state.facturas.length:0)}</b><span>ticket promedio</span></div>
    </div>
    <div class="card">
      <div class="serif" style="font-size:16px; margin-bottom:10px;">por segmento</div>
      <table><thead><tr><th>segmento</th><th>unidades vendidas</th><th>total</th></tr></thead><tbody>
        <tr><td>hair clips</td><td>${porSeg.clips.n}</td><td>${fmtCOP(porSeg.clips.total)}</td></tr>
        <tr><td>tank tops</td><td>${porSeg.tanks.n}</td><td>${fmtCOP(porSeg.tanks.total)}</td></tr>
      </tbody></table>
    </div>
    <div class="card">
      <div class="serif" style="font-size:16px; margin-bottom:10px;">por fecha</div>
      ${dias.length ? `<table><thead><tr><th>fecha</th><th>total del día</th></tr></thead><tbody>
        ${dias.map(d=>`<tr><td>${d}</td><td>${fmtCOP(porDia[d])}</td></tr>`).join("")}
      </tbody></table>` : `<div class="empty">aún no hay ventas</div>`}
    </div>`;
}

/* ── Catálogo (compartir con clientas) ── */
function viewCatalogo(){
  return `
    <div class="card">
      <p style="font-size:13px; line-height:1.6; color:var(--suave);">Las fotos, precios y cantidades ya se manejan directo en la pestaña 📦 Inventario — no hace falta salir de aquí. Esta pestaña es solo para compartir el catálogo con las clientas.</p>
    </div>
    <div class="card">
      <div class="serif" style="font-size:16px; margin-bottom:10px;">link del catálogo</div>
      <div class="linkbox">${CATALOGO_URL}</div>
      <div class="row">
        <button class="btn main" id="btn-copiar-link">📋 copiar link</button>
        <a class="btn wa" style="text-decoration:none;" href="https://wa.me/?text=${encodeURIComponent('🐚 ¡Mira el catálogo de acquamarina! '+CATALOGO_URL)}" target="_blank">💬 enviar por WhatsApp</a>
        <a class="btn" style="text-decoration:none;" href="mailto:?subject=${encodeURIComponent('Catálogo acquamarina 🐚')}&body=${encodeURIComponent('¡Hola! Te comparto el catálogo de acquamarina: '+CATALOGO_URL)}">✉️ enviar por correo</a>
      </div>
    </div>`;
}

/* ═══════════════════════ EVENTOS ═══════════════════════ */
function wireEvents(){
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{ state.tab=b.dataset.tab; render(); });
  document.querySelectorAll("[data-filtro]").forEach(b=>b.onclick=()=>{ state.invFiltro=b.dataset.filtro; render(); });
  document.querySelectorAll("[data-catsub]").forEach(b=>b.onclick=()=>{ state.catalogoSub=b.dataset.catsub; render(); });

  const btnRefrescarInv = document.getElementById("btn-refrescar-inv");
  if(btnRefrescarInv) btnRefrescarInv.onclick = async () => { toast("Actualizando inventario…"); await cargarTodo(); toast("Inventario actualizado ✓"); };

  const selCod = document.getElementById("f-codigo");
  if(selCod) selCod.onchange = () => {
    const opt = selCod.selectedOptions[0];
    document.getElementById("f-valor").value = opt?.dataset.precio || "";
  };

  const btnReg = document.getElementById("btn-registrar");
  if(btnReg) btnReg.onclick = async () => {
    const codigo = document.getElementById("f-codigo").value;
    const comprador = document.getElementById("f-comprador").value.trim();
    const valor = document.getElementById("f-valor").value;
    const forma = document.getElementById("f-forma").value;
    if(!codigo || !comprador){ toast("Falta escoger el producto o el comprador"); return; }
    btnReg.disabled = true; toast("Registrando venta…");
    try{ await llamar("factura",{codigo,comprador,valor,forma}); toast("Venta registrada ✓"); await cargarTodo(); state.tab="facturacion"; render(); }
    catch(err){ toast("No se pudo registrar: "+err.message); }
    btnReg.disabled = false;
  };

  const btnAgregar = document.getElementById("btn-agregar-prod");
  if(btnAgregar) btnAgregar.onclick = async () => {
    const codigo=document.getElementById("p-codigo").value.trim();
    const producto=document.getElementById("p-nombre").value.trim();
    const tipo=document.getElementById("p-tipo").value;
    const cantidad=document.getElementById("p-cant").value;
    const valorCompra=document.getElementById("p-compra").value;
    const valorVenta=document.getElementById("p-venta").value;
    const codigoProveedor=document.getElementById("p-proveedor").value.trim();
    if(!codigo||!producto){ toast("Falta código o nombre del producto"); return; }
    btnAgregar.disabled=true; toast("Agregando producto…");
    try{ await llamar("producto_nuevo",{codigo,producto,tipo,cantidad,valorCompra,valorVenta,codigoProveedor}); toast("Producto agregado ✓"); await cargarTodo(); state.tab="inventario"; render(); }
    catch(err){ toast("No se pudo agregar: "+err.message); }
    btnAgregar.disabled=false;
  };

  document.querySelectorAll("[data-editar]").forEach(b=>b.onclick=async ()=>{
    const codigo=b.dataset.editar;
    const p=state.inventario.find(x=>String(x.code)===String(codigo));
    const nuevaCant=prompt("Nueva cantidad:",p.cant);
    if(nuevaCant===null) return;
    const nuevoPrecio=prompt("Nuevo precio de venta:",p.valorVenta);
    if(nuevoPrecio===null) return;
    try{ await llamar("producto_editar",{codigo,cantidad:nuevaCant,valorVenta:nuevoPrecio}); toast("Producto actualizado ✓"); await cargarTodo(); }
    catch(err){ toast("No se pudo actualizar: "+err.message); }
  });

  const inputFoto = document.getElementById("input-foto");
  let codigoFotoActual = null;
  document.querySelectorAll("[data-foto]").forEach(b=>b.onclick=()=>{
    codigoFotoActual = b.dataset.foto;
    inputFoto.click();
  });
  if(inputFoto) inputFoto.onchange = async e => {
    const files = Array.from(e.target.files||[]);
    if(!files.length || !codigoFotoActual) return;
    toast(files.length>1 ? `Subiendo ${files.length} fotos…` : "Subiendo foto…");
    try{
      for(const f of files) await subirFoto(codigoFotoActual, f);
      toast("Foto(s) guardadas en Drive ✓");
    }catch(err){ toast("No se pudo subir: "+err.message); }
    inputFoto.value = "";
  };

  document.querySelectorAll("[data-cobrar]").forEach(b=>b.onclick=async ()=>{
    const id=b.dataset.cobrar;
    const forma=prompt('¿Cómo se cobró? Escriba "Efectivo" o "Transferencia"',"Efectivo");
    if(!forma) return;
    try{ await llamar("pago",{id,forma}); toast("Cuenta marcada como cobrada ✓"); await cargarTodo(); }
    catch(err){ toast("No se pudo actualizar: "+err.message); }
  });

  const btnCopiar = document.getElementById("btn-copiar-link");
  if(btnCopiar) btnCopiar.onclick = async () => { toast((await copyText(CATALOGO_URL)) ? "Link copiado 📋" : "No se pudo copiar"); };
}

cargarTodo();
</script>
</body>
</html>
